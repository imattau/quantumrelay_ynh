# Standalone TLS listener for the quantum-relay peer mesh (__APP__).
# This is a separate server block (not a `location` inside the app's main
# vhost) because the peer mesh needs its own public port, distinct from
# 443/80. It reuses the domain's existing YunoHost-managed certificate.
server {
    listen __PUBLIC_PEER_PORT__ ssl;
    listen [::]:__PUBLIC_PEER_PORT__ ssl;

    server_name __DOMAIN__;

    ssl_certificate     /etc/yunohost/certs/__DOMAIN__/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;

    access_log /var/log/nginx/__APP__-peer-access.log;
    error_log  /var/log/nginx/__APP__-peer-error.log;

    location / {
        proxy_pass http://127.0.0.1:__PORT_PEER__/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
