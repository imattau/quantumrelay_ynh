#sub_path_only rewrite^ __PATH__/ redirect;
location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_http_version 1.1;

  # Websocket upgrade (NIP-01 client connections)
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # Let the relay see real client info; it also serves the NIP-11 info
  # document on the same path via Accept: application/nostr+json.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  client_max_body_size 1M;

  more_set_headers "Access-Control-Allow-Origin: *";
}
