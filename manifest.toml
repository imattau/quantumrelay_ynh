packaging_format = 2

id = "quantumrelay"
name = "Quantum Relay"
description.en = "Nostr relay with quantum-walk propagation and reputation-based spam suppression"
description.fr = "Relais Nostr avec propagation par marche quantique et suppression du spam basée sur la réputation"

version = "0.1.2~ynh1"

maintainers = []

[upstream]
license = "MIT"
code = "https://github.com/imattau/quantum-rely"

[integration]
yunohost = ">= 11.2"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    # A Nostr relay must accept unauthenticated client connections; it is not
    # gated behind YunoHost SSO. Access control for the relay itself (NIP-42
    # auth, spam/reputation gating) is handled by quantum-relay, not YunoHost.

    [install.relay_name]
    ask.en = "Relay name (shown in the NIP-11 info document)"
    type = "string"
    default = "Quantum Relay"

    [install.relay_description]
    ask.en = "Relay description (shown in the NIP-11 info document)"
    type = "string"
    default = "Nostr relay with quantum walk propagation"
    optional = true

    [install.public_peer_port]
    ask.en = "Public port for the relay-to-relay peer mesh (must differ from 443/80 and be reachable from other relays)"
    # type="string"+pattern rather than type="number"+min/max: the
    # manifest.v2 JSON schema forbids min/max on install questions
    # (package_linter treats this as a critical schema-validation error),
    # while the core's NumberOption class would otherwise silently cap at
    # a default max=200 with no min/max set, rejecting any real port. The
    # actual 1024-65535 bound is enforced in scripts/install.
    type = "string"
    pattern.regexp = "^[0-9]{4,5}$"
    pattern.error = "Enter a 4 or 5 digit port number between 1024 and 65535"
    default = "8443"

    [install.require_auth]
    ask.en = "Require NIP-42 authentication before accepting EVENT submissions from clients?"
    type = "boolean"
    default = false

[resources]
    [resources.sources.main]
        url = "https://github.com/imattau/quantum-rely/releases/download/v0.1.2/quantum-relay-linux-amd64"
        sha256 = "c5a6706723cc7988fb7e932354e4776ba59cec86ada58585f042926e469614e7"
        format = "whatever"
        extract = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "quantum-relay-linux-amd64"

        [resources.sources.main.arm64]
        url = "https://github.com/imattau/quantum-rely/releases/download/v0.1.2/quantum-relay-linux-arm64"
        sha256 = "58b628ba2bfe4377032a2a84926a1291e20a604213d28f617c276c259e16b2d7"

        [resources.sources.main.armhf]
        url = "https://github.com/imattau/quantum-rely/releases/download/v0.1.2/quantum-relay-linux-armhf"
        sha256 = "af311f12091b0ca364ecaa2189ae72fadf2796e256e7bb63a56883caa4db9827"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
        main.url = "/"
        main.show_tile = false
        main.protected = false

    [resources.ports]
        # Internal, loopback-only listen port for the client-facing relay.
        # Reverse-proxied by YunoHost's nginx on 443/80.
        main.default = 8080
        main.exposed = false

        # Internal, loopback-only listen port for the peer mesh. Reverse-
        # proxied by a dedicated nginx server block (conf/nginx-peer.conf)
        # on the public peer_port chosen at install time.
        peer.default = 8081
        peer.exposed = false

    [resources.apt]
        packages = []
