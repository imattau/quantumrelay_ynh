name: YunoHost apps package linter

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone YunoHost apps package linter
        run: |
          git clone --depth=1 https://github.com/YunoHost/package_linter ~/package_linter

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ~/package_linter/requirements.txt

      - name: Run linter (human-readable output)
        continue-on-error: true
        run: |
          ~/package_linter/package_linter.py .

      - name: Run linter (fail only on non-catalog-membership issues)
        run: |
          ~/package_linter/package_linter.py --json . > linter.json
          python3 .github/check_linter_findings.py linter.json
